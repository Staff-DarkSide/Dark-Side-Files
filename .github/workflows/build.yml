name: Build DARKSIDE Launcher

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" -replace '^launcher-v','' } else { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Assets | Out-Null
          if (Test-Path background.png) { Copy-Item background.png Assets/background.png -Force }

      - name: Publish (win-x64, single file)
        shell: pwsh
        run: dotnet publish DarkSideLauncher.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DarkSideLauncher
          path: publish/DarkSideLauncher.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DarkSideLauncher.exe
